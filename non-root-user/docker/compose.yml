name: tide

services:
  non-root-user:
    build:
      args:
        ALPINE_PINNED_IMAGE: ${REGISTRY_HOST}:${REGISTRY_PORT}/${ALPINE_PINNED_IMAGE_NAME}
        NON_ROOT_USER_GID: ${NON_ROOT_USER_GID}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
        NON_ROOT_USER_UID: ${NON_ROOT_USER_UID}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${REGISTRY_HOST}:${REGISTRY_PORT}/${NON_ROOT_USER_IMAGE_NAME}
    image: ${REGISTRY_HOST}:${REGISTRY_PORT}/${NON_ROOT_USER_IMAGE_NAME}
