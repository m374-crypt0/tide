name: ${TIDE_PROJECT_NAME}

services:
  emacs:
    build:
      args:
        LLVM_IMAGE_NAME: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${LLVM_IMAGE_NAME}
        LLVM_OUTPUT_RESOURCE_DIR: ${LLVM_OUTPUT_RESOURCE_DIR}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
        EMACS_REVISION: ${EMACS_REVISION}
        EMACS_OUTPUT_RESOURCE_DIR: ${EMACS_OUTPUT_RESOURCE_DIR}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${EMACS_IMAGE_NAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${EMACS_IMAGE_NAME}
