name: ${TIDE_PROJECT_NAME}

include:
  - path: "${TIDE_ROOT_DIR}/docker-registry/docker/compose.yml"

services:
  alpine-pinned:
    build:
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${ALPINE_PINNED_IMAGE_NAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${ALPINE_PINNED_IMAGE_NAME}
