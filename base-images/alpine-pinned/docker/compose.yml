name: ${TIDE_PROJECT_NAME}

services:
  alpine-pinned:
    build:
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${ALPINE_PINNED_IMAGE_NAME}
    image: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${ALPINE_PINNED_IMAGE_NAME}
