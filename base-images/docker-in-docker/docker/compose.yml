name: ${TIDE_PROJECT_NAME}

services:
  docker-in-docker:
    build:
      args:
        NON_ROOT_USER_IMAGE_NAME: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${NON_ROOT_USER_IMAGE_NAME}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
        DOCKER_IN_DOCKER_DOCKER_GID: ${DOCKER_IN_DOCKER_DOCKER_GID}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${DOCKER_IN_DOCKER_IMAGE_NAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${DOCKER_IN_DOCKER_IMAGE_NAME}
  shell:
    environment:
      LC_ALL: en_US.UTF-8
      TERM: xterm-256color
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${DOCKER_IN_DOCKER_IMAGE_NAME}
    init: true
    volumes:
      - type: bind
        read_only: false
        source: ${DOCKER_IN_DOCKER_SOCKET_PATH}
        target: /var/run/docker.sock
