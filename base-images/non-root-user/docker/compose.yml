name: ${TIDE_PROJECT_NAME}

services:
  non-root-user:
    build:
      args:
        ALPINE_PINNED_IMAGE_NAME: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${ALPINE_PINNED_IMAGE_NAME}
        NON_ROOT_USER_GID: ${NON_ROOT_USER_GID}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
        NON_ROOT_USER_UID: ${NON_ROOT_USER_UID}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${NON_ROOT_USER_IMAGE_NAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${NON_ROOT_USER_IMAGE_NAME}
