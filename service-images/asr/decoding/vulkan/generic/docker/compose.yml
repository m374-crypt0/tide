name: ${TIDE_PROJECT_NAME}

services:
  advg:
    build:
      args:
        NON_ROOT_USER_IMAGE_NAME: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${NON_ROOT_USER_IMAGE_NAME}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
        LLVM_IMAGE_NAME: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${LLVM_IMAGE_NAME}
        LLVM_OUTPUT_RESOURCE_DIR: ${LLVM_OUTPUT_RESOURCE_DIR}
        ADVG_WHISPER_CPP_REVISION: ${ADVG_WHISPER_CPP_REVISION}
        ADVG_RENDER_GROUP_ID: ${ADVG_RENDER_GROUP_ID}
        ADVG_VIDEO_GROUP_ID: ${ADVG_VIDEO_GROUP_ID}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${ADVG_IMAGE_NAME}
    container_name: ${ADVG_CONTAINER_NAME}
    devices:
      - /dev/dri
      - /dev/kfd
    entrypoint:
      - sleep
      - infinity
    environment:
      - AMD_VULKAN_ICD=RADV
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
      - ADVG_SERVER_PORT
      - ADVG_HUGGING_FACE_TOKEN
      - ADVG_MODEL
    group_add:
      - ${ADVG_RENDER_GROUP_ID}
      - ${ADVG_VIDEO_GROUP_ID}
    image: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${ADVG_IMAGE_NAME}
    init: true
    # TODO: setup all host_ip to 127.0.0.1 then, make them configurable in .env
    ports:
      - name: decoding_server
        target: ${ADVG_SERVER_PORT}
        host_ip: 0.0.0.0
        protocol: tcp
        published: "${ADVG_SERVER_PORT}"
    post_start:
      - command: chown ${NON_ROOT_USER_NAME}:${NON_ROOT_USER_NAME} "/home/${NON_ROOT_USER_NAME}/.cache/huggingface"
        user: root
      - command: chown ${NON_ROOT_USER_NAME}:${NON_ROOT_USER_NAME} "/home/${NON_ROOT_USER_NAME}/decoding-setup"
        user: root
    volumes:
      - type: volume
        source: advg_hugging_face_cache
        target: "/home/${NON_ROOT_USER_NAME}/.cache/huggingface"
      - type: volume
        source: advg_decoding_setup
        target: "/home/${NON_ROOT_USER_NAME}/decoding-setup"
volumes:
  advg_hugging_face_cache:
  advg_decoding_setup:
