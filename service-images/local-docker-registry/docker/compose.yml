name: ${TIDE_PROJECT_NAME}

services:
  registry:
    build:
      args:
        LOCAL_DOCKER_REGISTRY_USER_NAME: ${LOCAL_DOCKER_REGISTRY_USER_NAME}
        LOCAL_DOCKER_REGISTRY_USER_PASSWORD: ${LOCAL_DOCKER_REGISTRY_USER_PASSWORD}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${LOCAL_DOCKER_REGISTRY_IMAGE_NAME}
    container_name: ${LOCAL_DOCKER_REGISTRY_CONTAINER_NAME}
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /root/htpasswd
    init: true
    image: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${LOCAL_DOCKER_REGISTRY_IMAGE_NAME}
    ports:
      - host_ip: 127.0.0.1
        name: registry_port
        protocol: tcp
        published: "${LOCAL_DOCKER_REGISTRY_PORT}"
        target: 5000
    volumes:
      - source: registry_storage
        target: /var/lib/registry
        type: volume
volumes:
  registry_storage:
