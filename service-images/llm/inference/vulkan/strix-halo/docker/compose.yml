name: ${TIDE_PROJECT_NAME}

services:
  livsh:
    build:
      args:
        NON_ROOT_USER_IMAGE_NAME: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${NON_ROOT_USER_IMAGE_NAME}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
        LLVM_IMAGE_NAME: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${LLVM_IMAGE_NAME}
        LLVM_OUTPUT_RESOURCE_DIR: ${LLVM_OUTPUT_RESOURCE_DIR}
        LIVSH_ROCMPFX_REVISION: ${LIVSH_ROCMPFX_REVISION}
        LIVSH_RENDER_GROUP_ID: ${LIVSH_RENDER_GROUP_ID}
        LIVSH_VIDEO_GROUP_ID: ${LIVSH_VIDEO_GROUP_ID}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${LIVSH_IMAGE_NAME}
    container_name: ${LIVSH_CONTAINER_NAME}
    devices:
      - /dev/dri
      - /dev/kfd
    entrypoint:
      - sleep
      - infinity
    environment:
      - AMD_VULKAN_ICD=RADV
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
      - LIVSH_MODEL_SERVER_PORT
      - LIVSH_HUGGING_FACE_TOKEN
      - LIVSH_MODEL
    group_add:
      - ${LIVSH_RENDER_GROUP_ID}
      - ${LIVSH_VIDEO_GROUP_ID}
    image: ${LOCAL_DOCKER_REGISTRY_HOST}:${LOCAL_DOCKER_REGISTRY_PORT}/${LIVSH_IMAGE_NAME}
    init: true
    ports:
      - name: inference_server
        target: ${LIVSH_MODEL_SERVER_PORT}
        host_ip: 0.0.0.0
        protocol: tcp
        published: "${LIVSH_MODEL_SERVER_PORT}"
    post_start:
      - command: chown ${NON_ROOT_USER_NAME}:${NON_ROOT_USER_NAME} "/home/${NON_ROOT_USER_NAME}/.cache/huggingface"
        user: root
      - command: chown ${NON_ROOT_USER_NAME}:${NON_ROOT_USER_NAME} "/home/${NON_ROOT_USER_NAME}/inference-setup"
        user: root
    volumes:
      - type: volume
        source: livsh_hugging_face_cache
        target: "/home/${NON_ROOT_USER_NAME}/.cache/huggingface"
      - type: volume
        source: livsh_inference_setup
        target: "/home/${NON_ROOT_USER_NAME}/inference-setup"
volumes:
  livsh_hugging_face_cache:
  livsh_inference_setup:
