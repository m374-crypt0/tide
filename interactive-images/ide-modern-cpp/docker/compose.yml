name: ${TIDE_PROJECT_NAME}

include:
  - path: "${TIDE_ROOT_DIR}/interactive-images/ide/docker/compose.yml"
  - path: "${TIDE_ROOT_DIR}/docker-registry/docker/compose.yml"

services:
  ide-modern-cpp:
    build:
      args:
        IDE_MODERN_CPP_IMAGE_NAME: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_MODERN_CPP_IMAGE_NAME}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_MODERN_CPP_IMAGE_NAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_MODERN_CPP_IMAGE_NAME}
  shell:
    container_name: ${IDE_MODERN_CPP_CONTAINER_NAME}
    hostname: ${IDE_MODERN_CPP_HOSTNAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_MODERN_CPP_IMAGE_NAME}
