name: ${TIDE_PROJECT_NAME}

include:
  - path:
      - ${TIDE_ROOT_DIR}/interactive-projects/ide/docker/compose.yml

services:
  ide-web-app:
    build:
      args:
        IDE_IMAGE_NAME: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_IMAGE_NAME}
        NON_ROOT_USER_NAME: ${NON_ROOT_USER_NAME}
        IDE_WEB_APP_BUN_VERSION: ${IDE_WEB_APP_BUN_VERSION}
        IDE_WEB_APP_FRONTEND_PORT: ${IDE_WEB_APP_FRONTEND_PORT}
        IDE_WEB_APP_BACKEND_PORT: ${IDE_WEB_APP_BACKEND_PORT}
      context: build/context
      dockerfile: ../Dockerfile
      tags:
        - ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_WEB_APP_IMAGE_NAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_WEB_APP_IMAGE_NAME}
  shell:
    container_name: ${IDE_WEB_APP_CONTAINER_NAME}
    hostname: ${IDE_WEB_APP_HOSTNAME}
    image: ${DOCKER_REGISTRY_HOST}:${DOCKER_REGISTRY_PORT}/${IDE_WEB_APP_IMAGE_NAME}
    ports:
      - host_ip: 0.0.0.0
        name: frontend_port
        protocol: tcp
        published: "${IDE_WEB_APP_FRONTEND_PORT}"
        target: ${IDE_WEB_APP_FRONTEND_PORT}
      - host_ip: 0.0.0.0
        name: backend_port
        protocol: tcp
        published: "${IDE_WEB_APP_BACKEND_PORT}"
        target: ${IDE_WEB_APP_BACKEND_PORT}
